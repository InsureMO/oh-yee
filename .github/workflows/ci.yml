name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      # Token 命名规范是硬约束(组件级 token 前缀必须等于组件 CSS 类前缀),
      # 单独成步且不允许失败,避免新的命名分歧混入。
      - name: Check token naming
        run: pnpm --filter @rainbow-oh/yee-c lint:tokens

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
